server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        return 204;
    }

    location = /experience {
        try_files /experience/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
